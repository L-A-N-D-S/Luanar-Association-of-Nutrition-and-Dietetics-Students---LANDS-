<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 450px;
        margin: 60px auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        color: #198754;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        background-color: white;
    }

    input:focus,
    select:focus {
        outline: 2px solid #198754;
        border-color: #198754;
    }

    button {
        width: 100%;
        padding: 13px;
        background-color: #198754;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #146c43;
    }

    button:disabled {
        background-color: #888;
        cursor: not-allowed;
    }

    #status {
        text-align: center;
        overflow-wrap: anywhere;
        line-height: 1.5;
    }

    .success {
        color: green;
    }

    .error {
        color: red;
    }
</style>

</head><body><div class="container">
    <h2>Student Registration</h2>

    <form id="registrationForm">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            maxlength="150"
            autocomplete="name"
            required
        >

        <label for="semester">Semester of Study</label>
        <select id="semester" name="semester" required>
            <option value="">Select your semester</option>
            <option value="Semester 1">Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4">Semester 4</option>
            <option value="Semester 5">Semester 5</option>
            <option value="Semester 6">Semester 6</option>
        </select>

        <button type="submit" id="submitButton">
            Register
        </button>

        <p id="status" role="status" aria-live="polite"></p>

    </form>
</div>

<script>
    // Your Google Apps Script deployment URL
    const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbx2ej1WEZff3W0B5WUA1YRQHP8MYdQQQyTIUMktIFJRVeW71_DpRizd9bqH9zl60IcFgQ/exec";

    const form = document.getElementById("registrationForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const semester = document.getElementById("semester").value;

        if (!name || !semester) {
            showStatus(
                "Please enter your full name and select your semester.",
                false
            );
            return;
        }

        button.disabled = true;
        button.textContent = "Submitting...";
        showStatus("Sending your registration...", true);

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    name: name,
                    semester: semester
                })
            });

            showStatus(
                "Your request was sent. Please check the spreadsheet to confirm your registration was saved.",
                true
            );

            form.reset();

        } catch (error) {
            showStatus(
                "Unable to send your registration. Please check your internet connection and try again.",
                false
            );
        } finally {
            button.disabled = false;
            button.textContent = "Register";
        }
    });

    function showStatus(message, success) {
        status.textContent = message;
        status.className = success ? "success" : "error";
    }
</script>

</body>
</html>
